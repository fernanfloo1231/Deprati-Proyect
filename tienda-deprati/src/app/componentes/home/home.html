<!-- SLIDER / CAROUSEL -->
<section class="slider">
  <div class="slides">
    <div class="slide"><img src="img/deslizante1.jpg" alt="Slide 1" /></div>
    <div class="slide"><img src="img/deslizante2.jpg" alt="Slide 2" /></div>
    <div class="slide"><img src="img/deslizante3.jpg" alt="Slide 3" /></div>
    <div class="slide"><img src="img/deslizante4.jpg" alt="Slide 4" /></div>
  </div>

  <button class="prev" (click)="prevSlide()">&#10094;</button>
  <button class="next" (click)="nextSlide()">&#10095;</button>

  <div class="indicators">
    <span
      *ngFor="let img of slides; let i = index"
      [class.active]="i === currentSlide"
      (click)="goToSlide(i)"
    >
    </span>
  </div>
</section>

<!-- SECCIÓN HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Televisores hasta 20% OFF</h1>
    <p>Compra ahora tus productos favoritos con envío gratis desde $100.</p>

    <!-- Botón que envía a la pestaña Ofertas -->
    <button class="btn-primary" (click)="irAOfertas()">Ver ofertas</button>
  </div>
</section>

<!-- SECCIÓN DE OFERTAS DESTACADAS -->
<section class="productos-destacados">
  <h2>🔥 Ofertas destacadas</h2>

  <div class="productos-grid">
    <div class="producto-card" *ngFor="let p of productosRotando">
      <div class="producto-img">
        <img [src]="getImagenUrl(p)" [alt]="p.nombre" />
      </div>

      <h3 class="producto-nombre">{{ p.nombre }}</h3>

      <div class="precio-container">
        <span class="precio-oferta">{{ p.precio_oferta | currency : 'USD' }}</span>
        <span
          class="precio-normal"
          *ngIf="p.precio_oferta && p.precio_normal && p.precio_oferta < p.precio_normal"
        >
          {{ p.precio_normal | currency : 'USD' }}
        </span>
      </div>

      <button class="btn-ver" (click)="verProductoEnCategoria(p)">Ver más</button>
    </div>
  </div>
</section>
