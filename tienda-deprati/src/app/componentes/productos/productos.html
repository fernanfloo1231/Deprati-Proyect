<!-- productos.html -->
<div class="productos-destacados">
  <h2>Productos</h2>
  <div *ngIf="productos.length === 0" class="sin-productos">No hay productos disponibles.</div>
  <div class="productos-grid">
    <div *ngFor="let p of productos" class="producto-card">
      <img
        *ngIf="p.imagen"
        [src]="p.imagen"
        [alt]="p.nombre"
        (error)="p.imagen = 'img/imagenplaceholder.jpg'"
      />
      <h3>{{ p.nombre }}</h3>
      <p class="cat">{{ p.categoria }}</p>
      <p class="desc">{{ p.descripcion }}</p>
      <p class="precio">
        ${{ p.descuento ? getPrecioFinal(p) : p.precio }}
        <span *ngIf="p.descuento" class="orig">${{ p.precio }}</span>
      </p>

      <div class="acciones-producto">
        <button type="button" class="btn-detalle" (click)="verDetalle(p)">Ver más</button>
        <button type="button" class="btn-agregar" (click)="agregarAlCarrito(p)">
          Agregar al carrito
        </button>
      </div>
    </div>
  </div>
</div>
